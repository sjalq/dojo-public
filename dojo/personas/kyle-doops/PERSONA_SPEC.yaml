  primary_sources_required: true
  spoken_voice_required: true
  portfolio_examples_required: false
  external_bio_allowed_for_facts_only: true
  # Special policy for this persona: shared-channel host isolation.
  host_verification_required: true
  host_verification_method: "description-opening names the presenter; confirmed against voice fingerprint in transcript"
