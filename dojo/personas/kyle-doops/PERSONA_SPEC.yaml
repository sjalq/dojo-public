# Kyle Doops (Kyle du Plessis) — technical-analysis host on the Crypto Banter
# YouTube channel; founder of Crypto Banter Academy / "The Whale Room". No books;
# the corpus is entirely spoken video (solo BTC technical-analysis livestreams).
# Voice/frameworks are therefore sourced from solo video only. The channel is
# multi-host (Ran Neuner, Sheldon Evans, et al.) so every source MUST be
# host-verified as Kyle-solo before use (see coverage_policy.host_verification).

