    - solo
    - interview_guest
  copyright_mode: source_safe_anchors
  notes: >
    Voice samples use two source types for diversity: one interview-guest
    (2MHIcabnjrA.md, Florida University talk, for tactical/instructive spoken
    mode) and two author sources (berkshire-letter-1989.md for diagnostic/
    self-critical mode, buy-american-i-am-nyt-oped-2008.md for declarative/
    refusing-the-panic mode). All three are safe single-voice sources.
    Never draw voice samples from r1E20HeIvRc.md (mixed voice) or from any
    pre-2024 annual-meeting material (not fetched, for the same reason).

