slug: warren-buffett
expert_name: Warren Buffett
persona_type: public_investor_writer
status: strict

# Warren Buffett is Chairman of Berkshire Hathaway (stepped down as CEO
# effective 2026-01-01; Greg Abel is now President & CEO). His body of work
# is organized less around named proprietary techniques (a Voss or a
# Dunford) and more around a small set of durable, decades-repeated
# principles argued through his own annual shareholder letters (1977-2024,
# his own unedited prose, freely published) -- the direct analog of an
# investor's public letters that persona_type: public_investor_writer exists
# for. Several of his most famous "signature" ideas are NOT his own --
# Margin of Safety and Mr. Market both belong to Benjamin Graham (Buffett's
# teacher), and are explicitly attributed to Graham inside Buffett's own
# letters/essays. The Scuttlebutt Method belongs to Philip Fisher and was
# NOT found anywhere in this corpus (Buffett does cite Fisher's book in other
# public talks, but no fetched source in this corpus documents it -- treat as
# an attribution-only reference if it surfaces via gap-check, do not build a
# topic file without a corpus source). Charlie Munger is already a separate
# dojo persona; Buffett shares 30+ years of annual-meeting stage time with
# him, so annual-meeting Q&A from 1994-2023 was deliberately NOT fetched
# (see content/MANIFEST.md Skipped section) to avoid guest/co-host voice
# contamination. One post-Munger (2024) annual-meeting video was fetched
# for framework context, tagged mixed-voice (Buffett + Greg Abel + Ajit
# Jain), never for direct quotation.

coverage_policy:
  latest_work_required: true
  primary_sources_required: true
  spoken_voice_required: true
  portfolio_examples_required: false
  external_bio_allowed_for_facts_only: true

source_targets:
  - type: recent_major_work
    minimum: 1
    purpose: "currency check for active experts -- 2025/2026 CEO succession material"
  - type: solo_video_or_podcast
    minimum: 1
    purpose: "spoken cadence"
  - type: interview
    minimum: 1
    purpose: "question-answer behavior"
  - type: author
    minimum: 1
    purpose: "primary written voice -- shareholder letters are the highest-fidelity source"

latest_work:
  checked_at: 2026-07-09
  title: "Warren Buffett's farewell message to shareholders (\"I'm going quiet\")"
  year: 2025
  included: true
  source_ref: "buffett-farewell-message-nov-2025"
  notes: >
    Buffett announced on 2025-11-10 that he would stop writing Berkshire's
    annual shareholder letter and stop speaking at the annual meeting,
    handing the CEO role to Greg Abel effective 2025-12-31/2026-01-01.
    His last authored shareholder letter was the 2024ltr.pdf (published
    2025-02-18, his 60th and final letter as CEO/author). Abel wrote the
    first CEO letter for FY2025 (2025ltr.pdf, published 2026-03) -- that
    letter is explicitly OUT of this persona's corpus (Abel's voice, not
    Buffett's). Buffett remains Chairman and attended the 2026-05-02 annual
    meeting from the shareholder floor rather than the stage, giving a
    ~25-minute one-on-one interview to CNBC's Becky Quick that day
    (video_id QQOWQcnNmr0) plus an earlier 2026-03-31 interview
    (video_id DtSrc1lgVpk, his first interview since stepping down as CEO).
    Both confirm the succession is holding ("We couldn't have made a better
    decision... [He's doing] everything I did and then some.") and are the
    currency check for this persona.

