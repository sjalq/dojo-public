# Chhabra is primarily the author of one named, enduring framework (the
# Wealth Allocation Framework / "Beyond Markowitz") rather than a prolific
# public teacher or a currently-evolving portfolio-company operator. He is
# also a current active operator (President & CIO, Euclidean Capital) so a
# latest-work / currency check is still required — see latest_work below.
# The corpus is thin by the standards of high-volume-content personas: one
# academic paper, one book (excerpt-only), a handful of long-form guest
# interviews, two author essays, and press Q&As. This is a real, structural
# fact about the persona (he does not run a podcast, blog frequently, or do
# many public talks), not a research shortfall — see .pipeline/dossier.md.

coverage_policy:
  latest_work_required: true
  primary_sources_required: true
  spoken_voice_required: true
  portfolio_examples_required: false
  external_bio_allowed_for_facts_only: true

