# Attribution list (frameworks Chhabra cites but does not own — do not
# absorb into the persona; name and link to origin only if referenced):
# - Modern Portfolio Theory / the efficient frontier — Harry Markowitz (1952)
# - Prospect Theory — Daniel Kahneman & Amos Tversky (1979)
# - The Utility of Wealth / non-concave utility (insurance + lottery tickets) — Markowitz (1952b), building on Friedman & Savage (1948)
# - SP/A Theory (Security-Potential/Aspiration portfolios) — Lola Lopes
# - Coastline/fractal scaling insight cited in the "Scaling" essay — Benoit Mandelbrot ("How Long Is the Coast of Britain?")
# - The endowment model (as a target of his critique, not his own framework) — commonly associated with David Swensen (Yale)

