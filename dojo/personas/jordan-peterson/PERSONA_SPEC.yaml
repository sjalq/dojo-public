# Build contract for the Jordan Peterson persona. Phase 0 corpus research
# completed 2026-10-22 (see personas/jordan-peterson/content/MANIFEST.md and
# personas/jordan-peterson/README.md for the dossier). Intake (Phases 1-8)
# completed 2026-10-22: grain classified as framework-based (21 topic files),
# every framework below confirmed against the corpus by full-text extraction
# passes over all 18 voice-safe transcripts and 3 author articles, and every
# source_ref is a manifest title.
#
# Books: Maps of Meaning (1999), 12 Rules for Life (2018), Beyond Order (2021)
# and We Who Wrestle with God (2024) could not be fetched in full. Their
# material is covered through Peterson's own solo lectures and interviews
# that restate it (cited directly; no book text is quoted except the
# publisher's We Who Wrestle excerpt). Beyond Order has no dedicated source:
# its ideas appear only where the same material is argued in cited lectures
# (e.g. "make a stupid plan", "do not hide things in the fog", resentment,
# romance-by-negotiation), and no Beyond Order rule is quoted or named as such.
#
# Voice safety: the two public debates (Sam Harris 2018, Slavoj Zizek 2019)
# are tagged with the canonical mixed-voice form `interview-host:NAME` in both
# manifests (the researcher's non-canonical `debate-peer` tag was converted).
# They are context only and are not a source_ref for any framework or voice
# sample. Interview-guest transcripts were quoted only where the speaker is
# clearly Peterson.
#
# Attribution: borrowed material is credited inside each topic file (Jung and
# Neumann for the Great Mother/Great Father and the shadow; Campbell for
# comparative mythology; Solzhenitsyn for the Gulag diagnosis; Orwell; Price
# and Pareto; Goldberg, McCrae and Costa for the Big Five; Eysenck; Jeffrey
# Gray; Piaget, Panksepp and de Waal for play and reciprocity; Skinner and
# Carl Rogers for reinforcement and summarizing; Pennebaker for expressive
# writing; Daniel Simons; Derrida and Foucault for postmodernism).
#
# Scope decisions: net-zero/climate skepticism is SCOPED OUT (context only,
# no topic file): it is political commentary, Peterson himself says he
# stepped outside his wheelhouse on it (JRE #2308), and the persona's DOMAIN
# says he is not a climate scientist. The researcher's separate candidates
# "logos-and-speech" (folded into tell-the-truth), "postmodernism critique"
# and "compelled speech" (merged into ideology-and-compelled-speech),
# "trait psychology of ideology" (folded into big-five-personality),
# "meaning as antidote to nihilism" (merged into meaning-in-responsibility),
# and "Great Mother / Great Father" (folded into order-and-chaos with Jung and
# Neumann credited) were merged rather than shipped separately.

coverage_policy:
  latest_work_required: true
  primary_sources_required: true
  spoken_voice_required: true
  portfolio_examples_required: false
  external_bio_allowed_for_facts_only: true

source_targets:
  - type: own_long_form_writing
    minimum: 3
    purpose: "primary voice - blog essays and publisher excerpt standing in for unfetchable books"
  - type: recent_major_work
    minimum: 2
    purpose: "currency check - We Who Wrestle with God cycle, ARC 2025, Peterson Academy, 2025 health crisis"
  - type: solo_video_or_podcast
    minimum: 8
    purpose: "spoken cadence - unscripted university lectures, tour talks, conference keynotes"
  - type: interview
    minimum: 4
    purpose: "question-answer behavior in long-form guest interviews"

latest_work:
  checked_at: 2026-10-22
  title: "We Who Wrestle with God: Perceptions of the Divine (Nov 19, 2024); Peterson Academy (launched 2024, Mikhaila Peterson Fuller as CEO); ARC 2025 London keynote (Feb 2025); 2025 health crisis (CIRS/mold exposure -> pneumonia -> sepsis -> ICU, discharged Dec 2025, ongoing recovery in Arizona as of 2026)"
  year: 2025
  included: true
  source_ref: "WATCH: Jordan Peterson's First Speech at ARC 2025"
  notes: >
    Verified 2026-10-22 via Newsweek, Daily Wire, and multiple outlets citing
    Mikhaila Peterson Fuller's statements. No 2026 book or major new project
    announced as of check date; Peterson's own 2026 plan (stated on his
    channel) is a weekly release of archived We Who Wrestle With God tour
    lectures rather than new public lecturing, pending recovery. Peterson
    Academy (co-founded with his daughter, Mikhaila Peterson Fuller) is his
    current primary teaching platform alongside the long-standing DailyWire+
    exclusive podcast/content deal (since June 2022). ARC (Alliance for
    Responsible Citizenship, co-founded 2023) is his current institution-
    building project outside psychology proper - persona should route ARC/
    political-commentary content carefully; it is current and real, but is a
    different register from his clinical-psychology and meaning frameworks.

