# Samples 1 and 2 are polished first-person prose (author). Sample 3 is a solo
# stage lecture; the auto-caption transcript was punctuated, and repeated
# words plus one false start were removed, with the wording otherwise
# verbatim (noted in persona.md). "My message to the Jews" was deliberately
# not used as a voice sample: its group-specific claims fall outside the
# advisor scope and the diagnostic mode is already carried by topic files.
voice_samples:
  - mode: manifesto
    source_ref: "On Wrestling With God (excerpt from We Who Wrestle with God)"
    source_type: author
    quote_safe: true
  - mode: refusing
    source_ref: "Alas, no re-educator to be found"
    source_type: author
    quote_safe: true
  - mode: coaching
    source_ref: "12 Rules for Life Tour - Brisbane, Australia."
