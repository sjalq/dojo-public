schema_version: 1
slug: jean-brunel
expert_name: Jean L.P. Brunel
persona_type: framework_author
status: strict

# Jean Brunel is a B2B wealth-management practitioner and journal editor, not a
# public-facing media figure. His corpus is thin relative to mass-media personas
# by necessity: his primary output (27+ years of Journal of Wealth Management
# editorials/articles) sits almost entirely behind a Portfolio Management
# Research institutional-SSO paywall. The one dominant named framework —
# goals-based wealth management — recurs across a 2002 book, a 2012 CFA
# Institute conference paper (the crown-jewel public source), a 2015 CFA
# Annual Conference talk, a 2015 book, and a 2018 anthology chapter. Treat this
# as ONE framework with several tightly-coupled facets (institutional-vs-
# individual, dreams/nightmares diagnostic, modular/"bicycle" architecture,
# iterative process, tax-aware sub-strategy) rather than forcing 20+
# independent topic files. See .pipeline/dossier.md for the full grain
# recommendation.

