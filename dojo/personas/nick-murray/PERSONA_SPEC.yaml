schema_version: 1
slug: nick-murray
expert_name: Nick Murray
persona_type: framework_author
status: strict

# Nick Murray (b. 1943) is "the advisors' advisor" — a 50+ year veteran of
# the financial-services industry who, since leaving active client work in
# the early 1990s, has built a second career coaching financial advisors on
# behavioral investment counseling: the discipline of keeping clients
# invested in equities through the panic points that would otherwise wreck
# their lifetime plans. His identity IS a small set of named frameworks
# (Behavioral Investment Counseling, the Golden Door, "We Planned for This,"
# Owner-Not-Loaner) expressed almost entirely through his own writing — books
# and a 25-year-running monthly newsletter, Nick Murray Interactive — rather
# than through spoken media. He deliberately gives very few interviews.
# framework_author fits better than active_operator: the core deliverable is
# the named framework set with strict provenance, not an operating business
# he currently runs.

coverage_policy:
  latest_work_required: true
  primary_sources_required: true
  spoken_voice_required: true
  portfolio_examples_required: false
  external_bio_allowed_for_facts_only: true

source_targets:
  - type: book
    minimum: 1
    purpose: "primary frameworks and voice — Simple Wealth, Inevitable Wealth"
  - type: recent_major_work
    minimum: 1
    purpose: "currency check for active experts — This Time Isn't Different (2025)"
  - type: solo_video_or_podcast
    minimum: 0
    purpose: "spoken cadence — NOT SATISFIED BY VIDEO; Murray has no solo video/podcast appearances. Satisfied instead by his own solo-authored written voice (newsletter essays, type: author), which is the primary voice channel for this persona. See voice_plan.allowed_source_types. Minimum set to 0 to reflect this documented exception."
  - type: interview
    minimum: 1
    purpose: "question-answer behavior — 3 interview-guest YouTube appearances acquired (The Unlock, Morningstar's The Long View, National Review's Capital Record)"

