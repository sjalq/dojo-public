# NOTE for intake author — attribution watchlist (frameworks the expert may
# reference but must not absorb as his own): Daniel Kahneman ("we would all
# be better investors if we just made fewer decisions" — quoted approvingly,
# not Murray's own coinage); Peter Lynch ("the real key to making money in
# stocks is not to get scared out of them" — quoted, not Murray's); Charlie
# Munger ("the first law of compounding is to never interrupt it
# unnecessarily" — quoted); Richard Thaler / behavioral economics generally
# (Murray cites Thaler's Nobel and "you can't change anybody's mind" as
# external validation, not as his own research). See dossier for detail.

voice_plan:
  minimum_samples: 3
  require_source_diversity: false
  allowed_source_types:
    - author
    - solo
    - interview_guest
  copyright_mode: source_safe_anchors
  # require_source_diversity set to false because Murray has no solo
  # video/podcast and deliberately gives very few interviews. All three
  # voice samples are drawn from his sole-authored newsletter (type: author),
  # which IS his primary voice channel. The dossier documents this constraint.

voice_samples:
  - mode: manifesto
    source_ref: "Nick Murray Interactive Sample Issue 2026"
    source_type: author
    quote_safe: true
  - mode: diagnostic
    source_ref: "Nick Murray Interactive Sample Issue 2026"
    source_type: author
    quote_safe: true
  - mode: refusing
    source_ref: "Nick Murray Interactive Sample Issue 2026"
    source_type: author
    quote_safe: true

proof_policy:
  invented_numbers_allowed: false
  placeholders_required_when_unverified: true

strong_rule_policy:
  require_why: true
  require_exception_or_risk_handling: true

validation:
  deterministic: true
  llm_review:
