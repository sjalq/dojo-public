# Build contract for the Evan Czaplicki persona (creator of the Elm programming
# language). Filled through Phase 0 by the corpus researcher; frameworks/voice
# sections are SEEDED with candidates and must be finalized by the intake
# author during Phases 4-5. All source_refs below are titles findable in
# personas/evan-czaplicki/content/MANIFEST.md (private) and
# sources/evan-czaplicki/MANIFEST.md (public).

coverage_policy:
  latest_work_required: true
  primary_sources_required: true
  spoken_voice_required: true
  portfolio_examples_required: false
  external_bio_allowed_for_facts_only: true

source_targets:
  - type: authored_writing
    minimum: 10
    purpose: "primary frameworks and written voice (elm-lang.org/news essays, the official Elm guide he authored, package design guidelines)"
  - type: recent_major_work
    minimum: 1
    purpose: "currency check - his 2023-2025 talks on language economics and adoption strategy"
  - type: solo_video_or_podcast
    minimum: 6
    purpose: "spoken cadence from solo conference talks (2014-2025)"
  - type: interview
    minimum: 2
    purpose: "question-answer behavior where Evan is the guest"

latest_work:
  checked_at: 2026-07-10
  title: "Road to Elm 1.0 (Elm 0.19.2 release announcement)"
  year: 2026
  included: true
  source_ref: "Road to Elm 1.0"
  notes: >
    Published 2026-07-06 (four days before this check). Evan released Elm
    0.19.2, announced a "road to 1.0" via a series of small non-breaking
    releases, and publicly named his database-related compiler Acadia
    (acadia.engineering, private alpha, public launch expected later 2026;
    captured as "Acadia - A pleasant language for efficient queries (landing
    page)"). Secondary latest work: "Keynote: Rethinking our Adoption
    Strategy - Evan Czaplicki | Lambda Days 2025" (platform vs productivity
    languages) and the GOTO 2024 / Developer Voices Nov 2024 interviews on
    open source economics. He relocated to Denmark (Kodsnack 604 video
    interview, Oct 2024).

