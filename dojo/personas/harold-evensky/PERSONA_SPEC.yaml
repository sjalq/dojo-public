# Harold Evensky is co-founder and chairman of Evensky & Katz /
# Foldes Financial Wealth Management, a retired Professor of Practice at
# Texas Tech University's Personal Financial Planning program, and the
# practitioner Morningstar CEO Don Phillips dubbed the "Dean of Financial
# Planning." He is classified framework_author because his identity in the
# corpus is overwhelmingly organized around two named, owned frameworks he
# invented and popularized for the planning profession: the core-and-satellite
# portfolio construction approach, and the two-bucket cash-flow reserve
# (bucket) strategy for retirement income distribution. He is still a living,
# occasionally-interviewed active practitioner (chairman of his firm as of
# the most recent corpus evidence, 2024), so the latest-work check is not
# waived the way it would be for a purely historical_author.

