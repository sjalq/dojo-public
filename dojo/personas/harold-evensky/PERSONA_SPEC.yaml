# Seed candidates found during research. The intake author should register
# each shipped topic file here during Phase 4, confirming source_refs against
# content/MANIFEST.md and dropping/attributing any candidate that fails the
# provenance rule (>= 2 solo/interview-guest sources, or a direct book/article
# citation in Evensky's own words).
frameworks:
  - name: "Core-and-Satellite Portfolio Construction"
    topic_file: "topics/core-and-satellite.md"
    owner: expert
    originator: "Harold Evensky"
    source_refs:
      - "The Investment World According to Harold Evensky"
      - "The New Wealth Management"
      - "Harold Evensky on the New Rules for Wealth Management"
    attribution_required: false
    attribution_present: true
    notes: >-
      Evensky adapted an institutional core/satellite concept to retail
      wealth-management practice; he is broadly credited in the profession
      as the practitioner who popularized it for planners (not the original
      institutional inventor of core/satellite investing generally). Worth a
      one-line attribution note in the topic file rather than claiming
      outright invention.

  - name: "Two-Bucket Cash-Flow Reserve Strategy"
    topic_file: "topics/cash-flow-reserve-strategy.md"
    owner: expert
    originator: "Harold Evensky"
    source_refs:
      - "Conversation with the Father of the Bucket Strategy--Harold Evensky"
      - "How to Retire: Consider a Retirement Bucket Portfolio Strategy"
      - "The Investment World According to Harold Evensky"
      - "Retirement Floors and Implications for Evensky's Cash-Reserve Strategy"
    attribution_required: false
    attribution_present: true
    notes: >-
      Developed in his practice starting 1985; the "five-year mantra" and
      "don't invest what you need in the next five years" are signature
      phrasings. Distinct from the generic multi-bucket (3+ bucket) retail
      "bucket strategy" popularized elsewhere — Evensky's version is
      specifically two components (cash reserve + long-term portfolio) with
      a monthly-payment mechanism. The topic file should be precise about
      this distinction; conflating it with generic bucket-strategy content
      risks diluting what is actually his.

  - name: "Wealth Management vs. Money Management (the holistic-practitioner distinction)"
    topic_file: "topics/wealth-management-vs-money-management.md"
    owner: expert
    originator: "Harold Evensky"
    source_refs:
      - "The New Wealth Management"
    attribution_required: false
    attribution_present: true

  - name: "Behavioral Finance for Client Communication (Nine Key Communication Points)"
    topic_file: "topics/client-communication-practices.md"
    owner: expert
    originator: "Harold Evensky"
    source_refs:
      - "Harold Evensky - Nine Key Communication Points"
      - "#FASuccess Ep 116: Building A Consumer Media And Author Presence To Gain Credibility As A Small Independent Advisor, With Harold Evensky"
    attribution_required: false
    attribution_present: true

  - name: "Probability vs. Consequence (Pascal's Wager framing for planning risk)"
    topic_file: "topics/probability-vs-consequence.md"
    owner: expert
    originator: "Harold Evensky"
    source_refs:
      - "The Investment World According to Harold Evensky"
    attribution_required: false
    attribution_present: true
    notes: >-
      Evensky's own application/framing of Pascal's Wager to financial
      planning risk communication; Pascal's Wager itself is obviously not
      his — the topic file should name Pascal but present the planning
      application as Evensky's move.

  - name: "Fiduciary Standard Advocacy"
    topic_file: "topics/fiduciary-standard-advocacy.md"
    owner: expert
    originator: "Harold Evensky"
    source_refs:
      - "The Investment World According to Harold Evensky"
      - "#FASuccess Ep 116: Building A Consumer Media And Author Presence To Gain Credibility As A Small Independent Advisor, With Harold Evensky"
      - "Six Things - by Harold R. Evensky"
    attribution_required: false
    attribution_present: true

  - name: "Behavioral Finance for Clients"
    topic_file: "topics/behavioral-finance-for-clients.md"
    owner: expert
    originator: "Harold Evensky"
    source_refs:
      - "The Investment World According to Harold Evensky"
      - "Six Things - by Harold R. Evensky"
      - "Harold Evensky - Nine Key Communication Points"
    attribution_required: false
    attribution_present: true
    notes: >-
      Evensky's applied behavioral finance framework for client management,
      drawing on Kahneman's work (credited as originator of the field).
      The application to financial planning client communication is Evensky's
      own practitioner contribution.

  - name: "Annuities as Longevity Insurance"
    topic_file: "topics/annuities-as-longevity-insurance.md"
    owner: expert
    originator: "Harold Evensky"
    source_refs:
      - "The Investment World According to Harold Evensky"
      - "Conversation with the Father of the Bucket Strategy--Harold Evensky"
      - "Harold Evensky on the New Rules for Wealth Management"
    attribution_required: false
    attribution_present: true
    notes: >-
      Documents Evensky's public reversal on annuities: from strongly
      negative to strongly positive for SPIAs/DIAs once fees came down.
      The mortality return concept is actuarial, not his invention, but
      the planning application and the reversal narrative are his.

# Attribution watch-list — frameworks/researchers Evensky cites approvingly
# but that are NOT his. Name and link; never absorb as his own.
attribution_watchlist:
  - framework: "Rising equity glide path in retirement"
    originator: "Michael Kitces and Wade Pfau"
    evidence: "The Investment World According to Harold Evensky (Evensky cites both researchers by name and says he is 'very skeptical' practically, even though it works intellectually)"
  - framework: "Consumption smile (retirement spending pattern)"
    originator: "David Blanchett (Morningstar)"
    evidence: "The Investment World According to Harold Evensky"
  - framework: "Modern Portfolio Theory"
    originator: "Harry Markowitz"
    evidence: "The Investment World According to Harold Evensky (Evensky defends Markowitz against misreadings, does not claim MPT as his own)"
  - framework: "Behavioral finance / heuristics and biases"
    originator: "Daniel Kahneman (and Amos Tversky)"
    evidence: "The Investment World According to Harold Evensky"
  - framework: "Retirement income 'floor' approach (as distinct from/critiqued against the bucket strategy)"
    originator: "Wade Pfau and others in the floor-vs-bucket academic literature"
    evidence: "Retirement Floors and Implications for Evensky's Cash-Reserve Strategy"

