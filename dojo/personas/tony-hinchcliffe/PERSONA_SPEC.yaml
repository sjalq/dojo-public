    minimum: 1
    purpose: "currency check - Kill Tony+ subscription, Red Seat Ventures deal, July 2026 JRE appearance"
  - type: interview
    minimum: 4
    purpose: "long-form guest interviews where he explains craft and business (JRE, Theo Von)"
  - type: own_long_form_writing
    minimum: 0
    purpose: "none found - Hinchcliffe has not published long-form prose; corpus is spoken"
  - type: solo_video_or_podcast
    minimum: 0
    purpose: "no clean solo-only source acquired (Making Friends special is private; One Shot pulled; Man of the People not transcribed) - see gaps"

latest_work:
  checked_at: 2026-10-22
  title: "Kill Tony+ subscription launch and Red Seat Ventures (Fox Corp/Tubi) distribution deal (Apr 2026); Tony Hinchcliffe: Man of the People Netflix special (Jun 2026); JRE #2522 (Jul 2, 2026)"
  year: 2026
  included: true
  source_ref: "Tony Hinchcliffe launches 'Kill Tony+' subscription. Here's what fans get (Yahoo, 2026)"
  notes: >
    Verified 2026-10-22 by the researcher. Kill Tony has moved from a scrappy live
    podcast to a multi-platform business: a $5/mo Supercast subscription tier
    (Kill Tony+) and a multiyear Red Seat Ventures (Fox Corp/Tubi Media Group)
    ad-sales and distribution deal (Apr 2026). His solo special "Man of the People"
    (Netflix, Jun 2026) is in the corpus only as a fact (Wikipedia); no transcript.
    The most recent first-person source is JRE #2522 (Jul 2026), which covers the
    Roast of Kevin Hart backlash (George Floyd joke), the Oct 2024 MSG rally set
    ("a last-second filler because they gave me more time than everybody"), his
    roast-set strategy ("everybody gets it is always my formula"), the Kill Tony
    Trump/Biden episode, and turning down Saudi money. It does NOT discuss "Man of
    the People" (researcher's earlier note was wrong; corrected at intake).

