# Build contract for the Tony Hinchcliffe persona. Phase 0 corpus research completed
# 2026-10-22 (see personas/tony-hinchcliffe/content/MANIFEST.md and
# personas/tony-hinchcliffe/README.md for the dossier). Hinchcliffe has written no
# long-form prose; the corpus is spoken. Kill Tony itself is structurally mixed-voice
# (celebrity panel every episode) and was deliberately NOT acquired; his format and
# judging philosophy are sourced from him explaining it first-person as a guest.
#
# INTAKE (2026-10-22): frameworks and voice samples CONFIRMED AND REGISTERED.
# Quotes were located in speaker-labelled derivatives of the six guest interviews
# (content/diarized/<videoId>.diarized.md, Gemini 3.1 Pro transcription from the
# YouTube audio, Oct 2026). Locators below are diarized timestamps. Every passage
# used as a voice sample or direct quote was cross-checked against the raw
# undiarized captions (content/youtube/<videoId>.md) and its conversational context.
# Known diarization errors found and avoided: inrnVpGsKN4 01:47:36 ("I would have
# never told you to do that joke...") is Rogan, mislabelled as Tony; HKa6m9HpWUU
# 129:06 and 136:33 are Tony, mislabelled as Rogan; tlzUDRwCVgs 00:07:41 ("my kid
# told me on TikTok") is not Tony. None of these are used as Tony quotes.
#
# Researcher candidates pruned at intake:
# - "Brutal feedback as the product" (Slate-only press characterization) is DROPPED
#   as a standalone framework. What survives is his own first-person account of how
#   he reads and pushes comics (Theo Von 00:14:17, 100:00:00; JRE #1400 131:45) and
#   the notes he gives (JRE #1471 01:43:09), folded into post-set-interview.md and
#   one-minute-set.md.
# - "Kill Tony as launching pad" is no longer Rogan-only: Hinchcliffe says it himself
#   ("we've had so many people start on Kill Tony, literally start there", JRE #1400
#   130:13) and describes the regulars and golden-ticket winners (Theo Von 00:33:16,
#   JRE #1948 02:06:48-02:26:13). Folded into kill-tony-format.md and one-minute-set.md.
# - "Independent media business" is now grounded in his own statements (Theo Von
#   01:01:08, 00:20:00, 00:49:15; JRE #2522 01:53:19, 132:53), not only Yahoo.
# - The researcher's note that JRE #2522 discusses "Man of the People" is WRONG: the
#   special is not mentioned in either the raw or diarized transcript. Corrected in
#   both MANIFESTs. The special remains a known gap (no transcript).

