# Magnus Heystek is a South African investment strategist and co-founder/director
# of Brenthurst Wealth Management, and a former long-time financial journalist
# (The Star's business/investment editor, Moneyweb/RSG columnist and radio host).
# His body of work is not organized around named proprietary frameworks the way
# a Voss or a Dunford is -- it is a single, decades-long, evidence-backed
# conviction (offshore diversification against South African sovereign/currency/
# policy risk) argued through recurring reasoning moves, historical data
# comparisons, and client case studies. persona_type is public_investor_writer:
# his BizNews/Moneyweb columns and on-air commentary are the analog of an
# investor's public letters -- avoid leaking Brenthurst-as-a-company marketing
# voice or other BizNews personalities' (Alec Hogg, Piet Viljoen, Rob Hersov)
# framings into the persona.

coverage_policy:
  latest_work_required: true
  primary_sources_required: true
  spoken_voice_required: true
  portfolio_examples_required: false
  external_bio_allowed_for_facts_only: true

