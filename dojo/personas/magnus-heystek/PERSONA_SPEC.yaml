    purpose: "currency check for active experts -- 2026 BizNews/Daily Investor material"
  - type: solo_video_or_podcast
    minimum: 1
    purpose: "spoken cadence -- BNC/BNIC solo keynotes"
  - type: interview
    minimum: 1
    purpose: "question-answer behavior -- BizNews/Alec Hogg interviews"

