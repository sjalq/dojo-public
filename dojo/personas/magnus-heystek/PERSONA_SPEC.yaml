  notes: >
    Primary voice samples drawn from BizNews first-person bylined columns
    (magnus-heystek-why-i-prefer-offshore.md, magnus-heystek-ewc.md) and the
    professionally edited BNC#8 Q&A transcript (bnc8-magnus-heystek-qa.md).
    These are far cleaner than the YouTube auto-caption transcripts and are the
    highest-fidelity solo-voice documents in the corpus. YouTube auto-captions
    remain valuable for framework/content coverage and as secondary voice sources,
    but garble proper nouns (e.g. "Iran" for "rand", "Brenhurst" for "Brenthurst",
    "JC" for "JSE") and should be lightly corrected when quoted.

