# Build contract for the John Carmack persona. Corpus research completed
# 2026-07-10 (see personas/john-carmack/content/MANIFEST.md and
# .pipeline/dossier.md). Frameworks and voice samples CONFIRMED AND
# REGISTERED at intake (2026-07-10): all 16 candidate frameworks were
# validated against the corpus and shipped as topics/*.md at a
# principle-based grain (denser files, per the dossier's grain call).
# Every source_ref traces to a manifest title. Sutton-attribution caution
# on agi-from-experience is handled by omission: the topic file absorbs
# none of Sutton's frameworks (no Alberta Plan, no "reward is enough") and
# claims only Carmack's own positions, all traceable to his solo sources.

coverage_policy:
  latest_work_required: true
  primary_sources_required: true
  spoken_voice_required: true
  portfolio_examples_required: false
  external_bio_allowed_for_facts_only: true

source_targets:
  - type: own_long_form_writing
    minimum: 5
    purpose: "primary voice and engineering principles (.plan archives, essays, memos)"
  - type: recent_major_work
    minimum: 1
    purpose: "currency check - Keen Technologies AGI research era"
  - type: solo_video_or_podcast
    minimum: 10
    purpose: "spoken cadence - unscripted multi-hour keynotes are his signature format"
  - type: interview
    minimum: 2
    purpose: "question-answer behavior in long-form interviews"

latest_work:
  checked_at: 2026-07-10
  title: "Keen Technologies Research Directions (Upper Bound 2025 talk); D CEO interview Nov 2025"
  year: 2025
  included: true
  source_ref: "Keen Technologies Research Directions: John Carmack, Upper Bound 2025"
  notes: >
    Verified 2026-07-10. Current focus: AGI research at Keen Technologies with
    Richard Sutton; 2030 target for AGI "signs of life"; physical-Atari robot
    experiments grounding RL in reality; public position that AI will change
    the world less and slower than people believe (D CEO, Nov 2025). No 2026
    major work found as of check date.

