# Attribution list: well-known concepts Marks references/reuses but that
# belong to other named people. Must be attributed if cited, never presented
# as Marks's own framework.
attribution_watchlist:
  - concept: "Efficient Market Hypothesis / Second-level thinking's academic root"
    originator: "Eugene Fama and the Chicago School (academic finance)"
  - concept: "Mr. Market"
    originator: "Benjamin Graham (The Intelligent Investor)"
  - concept: "The Loser's Game (winner's game vs. loser's game in tennis/investing)"
    originator: "Charles D. Ellis"
  - concept: "Mental models / lattice of models, 'invert, always invert', circle of competence"
    originator: "Charlie Munger -- ALREADY A SEPARATE DOJO PERSONA. Do not absorb."
  - concept: "Fooled by Randomness / Black Swan framing"
    originator: "Nassim Nicholas Taleb"
  - concept: "A Short History of Financial Euphoria / 'extreme brevity of the financial memory' / the 'bezzle'"
    originator: "John Kenneth Galbraith"
  - concept: "The Yale Model / endowment investing"
    originator: "David Swensen"
  - concept: "Devil Take the Hindmost, The Price of Time (histories of speculation/interest rates)"
    originator: "Edward Chancellor"

voice_plan:
  minimum_samples: 3
  require_source_diversity: true
  allowed_source_types:
    - author
    - solo
    - interview_guest
  copyright_mode: source_safe_anchors
  notes: >
    Oaktree memo pages carry an explicit no-reproduction notice, so verbatim
    300-500 word voice-sample blocks should be drawn primarily from
    interview-guest transcripts (Knowledge Project, In Good Company, Money
    Maze, TBPN) or the solo 2015 talk (content/youtube/V44vd4sJcPs.md),
    which are free of that restriction. Short (1-2 sentence) memo quotations
    are acceptable as fair-use illustration inside topic files, but should
    not be stitched into a single long "voice sample" block that approaches
    full-paragraph reproduction of a specific memo.

voice_samples:
  - mode: diagnostic
    source_ref: "content/youtube/V44vd4sJcPs.md"
    source_type: solo
    quote_safe: true
  - mode: tactical
    source_ref: "content/youtube/jZMbKvJqEVo.md"
    source_type: interview_guest
    quote_safe: true
  - mode: coaching
    source_ref: "content/youtube/vZJHQrGS7PE.md"
    source_type: interview_guest
    quote_safe: true

proof_policy:
