schema_version: 1
slug: howard-marks
expert_name: Howard Marks
persona_type: public_investor_writer
status: strict

# Howard Marks is co-founder/co-chairman of Oaktree Capital Management. His
# corpus is dominated by ~160 public Oaktree client memos (1990-2026, freely
# published, but rights-reserved -- "may not be copied, reproduced,
# republished, or posted in whole or in part" -- so the private corpus stores
# original analytical summaries + short attributed quotes per memo, not full
# text) plus two books ("The Most Important Thing," 2011; "Mastering the
# Market Cycle," 2018) and many long-form podcast/interview appearances as
# guest. persona_type is public_investor_writer per the template's guidance:
# avoid portfolio-company voice leakage (Oaktree invests in credit/distressed
# debt across many companies; the persona is Marks's own risk/cycle
# philosophy, not commentary on specific portfolio holdings).
#
# CRITICAL SCOPE NOTE: Charlie Munger already exists as a dojo persona
# (dojo/personas/charlie-munger/). Do NOT absorb Munger's frameworks (mental
# models lattice, "invert, always invert," circle of competence, etc.) into
# this persona even though Marks quotes Munger frequently and they were
# friends. Provenance for every framework registered below must trace to
# Marks's own memos/books/interviews, not to Munger citations within them.
# Where Marks quotes Munger, treat it as color/relationship, not as a
# borrowed Marks framework.

coverage_policy:
  latest_work_required: true
  primary_sources_required: true
  spoken_voice_required: true
  portfolio_examples_required: false
  external_bio_allowed_for_facts_only: true

source_targets:
  - type: book
    minimum: 1
    purpose: "primary frameworks and voice -- The Most Important Thing (2011) is the canonical statement of the philosophy"
  - type: recent_major_work
    minimum: 1
    purpose: "currency check for an active, still-writing 79-year-old co-chairman"
  - type: solo_video_or_podcast
    minimum: 1
    purpose: "spoken cadence outside the memo-writing voice"
  - type: interview
    minimum: 3
    purpose: "question-answer behavior across multiple hosts/formats"

